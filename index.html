<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>我的行程 — 工作與生活</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="我的行程">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f7f4ef">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f7f4ef;
    --card: #ffffff;
    --ink: #2b2a28;
    --ink-soft: #6b6762;
    --line: #e7e2d9;

    --work-1: #2e6fa8; /* 國小備課：藍 */
    --work-2: #157a5f; /* 國中備課：深teal綠 */
    --work-3: #4b46a3; /* 高中備課：靛紫 */
    --work-4: #8a3f9e; /* 作文：紫紅 */
    --work-5: #4fb0c4; /* 文本閱讀：亮青 */
    --work-6: #5a6b7a; /* 考卷製作：灰藍（中性） */

    --life-1: #b5572e; /* 上課安排：赭橘 */
    --life-2: #d98b1f; /* 運動：琥珀橘 */
    --life-3: #9e8a1f; /* 交流進修：橄欖金 */
    --life-4: #b5416b; /* 休閒：莓紅 */
    --life-5: #6b5a4a; /* 雜事處理：灰棕（中性） */
    --life-6: #c0392b; /* 特別事項：紅 */
    --life-7: #5f9e45; /* 整理家務：草綠 */
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "Noto Sans TC", -apple-system, sans-serif;
    min-height: 100vh;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }

  header.top {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 22px;
  }

  header.top h1 {
    font-family: "Noto Serif TC", serif;
    font-weight: 700;
    font-size: 26px;
    margin: 0;
    letter-spacing: 0.5px;
  }

  header.top p {
    margin: 4px 0 0;
    color: var(--ink-soft);
    font-size: 13px;
  }

  .layout {
    display: grid;
    grid-template-columns: 220px 1fr;
    gap: 20px;
  }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
  }

  /* ---- Sidebar ---- */
  .sidebar {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .group {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 14px;
  }

  .group h2 {
    font-family: "Noto Serif TC", serif;
    font-size: 14px;
    font-weight: 500;
    margin: 0 0 10px;
    color: var(--ink-soft);
    letter-spacing: 1px;
  }

  .tag-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    border: 1px solid transparent;
    background: transparent;
    border-radius: 10px;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13.5px;
    color: var(--ink);
    cursor: pointer;
    text-align: left;
    margin-bottom: 2px;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .tag-btn:hover { background: #f3f0ea; }

  .tag-btn.active {
    background: #fbf9f5;
    border-color: var(--ink);
    font-weight: 600;
  }

  .dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex: 0 0 auto;
  }

  .hint {
    font-size: 12px;
    color: var(--ink-soft);
    line-height: 1.6;
    padding: 4px 2px 0;
  }

  .clear-btn {
    margin-top: 4px;
    width: 100%;
    border: 1px solid var(--line);
    background: var(--card);
    border-radius: 10px;
    padding: 8px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .clear-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

  /* ---- Calendar card / nav ---- */
  .calendar-card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 18px;
  }

  .cal-nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 14px;
  }

  .cal-nav .month-label {
    font-family: "Noto Serif TC", serif;
    font-size: 18px;
    font-weight: 600;
  }

  .nav-btn {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: #fff;
    cursor: pointer;
    font-size: 15px;
    color: var(--ink-soft);
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .nav-btn:hover { border-color: var(--ink); color: var(--ink); }
  .nav-group { display: flex; gap: 6px; align-items: center; }

  .nav-right { display: flex; gap: 8px; align-items: center; }

  .today-btn {
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12px;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .today-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

  .view-switch {
    display: flex;
    background: #f1ede6;
    border-radius: 999px;
    padding: 3px;
    gap: 2px;
  }
  .view-switch button {
    border: none;
    background: transparent;
    border-radius: 999px;
    padding: 5px 12px;
    font-size: 12.5px;
    font-family: inherit;
    color: var(--ink-soft);
    cursor: pointer;
  }
  .view-switch button.active {
    background: #fff;
    color: var(--ink);
    font-weight: 600;
    box-shadow: 0 1px 2px rgba(0,0,0,0.08);
  }

  /* ---- Month view ---- */
  .grid-week {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }

  .grid-week span {
    text-align: center;
    font-size: 12px;
    color: var(--ink-soft);
    padding-bottom: 4px;
  }

  .grid-days {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }

  .day {
    min-height: 92px;
    border-radius: 12px;
    border: 1px solid var(--line);
    background: #fff;
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    cursor: pointer;
    transition: border-color 0.15s ease;
  }

  .day:hover { border-color: var(--ink-soft); }
  .day.empty { visibility: hidden; cursor: default; }

  .day .num {
    font-size: 13px;
    color: var(--ink);
    flex: 0 0 auto;
  }

  .day.is-today .num {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
  }

  .chip-list {
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow: hidden;
  }

  .tag-chip {
    font-size: 10px;
    line-height: 1.5;
    padding: 1px 6px;
    border-radius: 6px;
    color: #fff;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chip-more {
    font-size: 10px;
    color: var(--ink-soft);
    padding: 0 2px;
  }

  /* ---- Week view ---- */
  .week-grid {
    display: grid;
    grid-template-columns: repeat(7, minmax(96px, 1fr));
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 4px;
  }

  .week-col {
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 8px;
    min-height: 180px;
    background: #fff;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }

  .week-col-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--line);
  }

  .week-col-head .wd { font-size: 11px; color: var(--ink-soft); }
  .week-col-head .dn {
    font-size: 15px;
    margin-top: 2px;
  }
  .week-col.is-today .week-col-head .dn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    background: var(--ink);
    color: #fff;
  }

  .week-col .chip-list { flex: 1; }
  .week-col .tag-chip { font-size: 10.5px; padding: 3px 6px; }

  /* ---- Day view ---- */
  .day-view-head {
    display: flex;
    flex-direction: column;
    gap: 2px;
    margin-bottom: 14px;
  }
  .day-view-head .big-date {
    font-family: "Noto Serif TC", serif;
    font-size: 20px;
    font-weight: 600;
  }
  .day-view-head .sub {
    font-size: 12.5px;
    color: var(--ink-soft);
  }

  .pin-section {
    background: #fbf3e8;
    border: 1px solid #ecd9b8;
    border-radius: 14px;
    padding: 12px 14px;
    margin-bottom: 14px;
  }
  .pin-section h3 {
    margin: 0 0 8px;
    font-size: 12.5px;
    color: #9c7a2e;
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 5px;
  }

  .entry-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 10px 4px;
    border-bottom: 1px solid var(--line);
    cursor: pointer;
  }
  .entry-row:last-child { border-bottom: none; }

  .entry-row .edot {
    width: 11px;
    height: 11px;
    border-radius: 50%;
    margin-top: 4px;
    flex: 0 0 auto;
  }

  .entry-row .etext { flex: 1; min-width: 0; }
  .entry-row .elabel { font-size: 13.5px; font-weight: 600; }
  .entry-row .enote {
    font-size: 12.5px;
    color: var(--ink-soft);
    margin-top: 2px;
    white-space: pre-wrap;
    word-break: break-word;
  }

  .pin-toggle {
    border: none;
    background: transparent;
    font-size: 15px;
    cursor: pointer;
    color: #c7b27a;
    flex: 0 0 auto;
    padding: 2px;
  }
  .pin-toggle.pinned { color: #b5852b; }

  .empty-note {
    font-size: 12.5px;
    color: var(--ink-soft);
    padding: 10px 4px;
  }

  .add-entry-btn {
    margin-top: 12px;
    width: 100%;
    border: 1px dashed var(--line);
    background: #fbf9f5;
    border-radius: 12px;
    padding: 10px;
    font-size: 13px;
    color: var(--ink-soft);
    cursor: pointer;
    font-family: inherit;
  }
  .add-entry-btn:hover { color: var(--ink); border-color: var(--ink-soft); }

  /* ---- Entry sheet (add/edit modal) ---- */
  .sheet-overlay {
    position: fixed;
    inset: 0;
    background: rgba(30, 28, 24, 0.4);
    display: flex;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .sheet-overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    background: #fff;
    width: 100%;
    max-width: 480px;
    border-radius: 20px 20px 0 0;
    padding: 18px 18px calc(18px + env(safe-area-inset-bottom));
    transform: translateY(100%);
    transition: transform 0.25s ease;
    max-height: 85vh;
    overflow-y: auto;
  }
  .sheet-overlay.open .sheet { transform: translateY(0); }

  .sheet h3 {
    margin: 0 0 12px;
    font-family: "Noto Serif TC", serif;
    font-size: 16px;
  }

  .sheet-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 12px;
  }

  .sheet-tag-btn {
    border: 1.5px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12.5px;
    font-family: inherit;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: var(--ink);
  }
  .sheet-tag-btn.selected {
    border-color: var(--ink);
    font-weight: 600;
    background: #faf8f4;
  }

  .sheet textarea {
    width: 100%;
    min-height: 70px;
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 10px 12px;
    font-family: inherit;
    font-size: 13.5px;
    resize: vertical;
    margin-bottom: 12px;
  }
  .sheet textarea:focus { outline: 1.5px solid var(--ink-soft); }

  .pin-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 13px;
    color: var(--ink);
    margin-bottom: 16px;
  }

  .sheet-actions {
    display: flex;
    gap: 8px;
  }
  .sheet-btn {
    flex: 1;
    border-radius: 10px;
    padding: 11px;
    font-size: 13.5px;
    font-family: inherit;
    cursor: pointer;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
  }
  .sheet-btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
  .sheet-btn.danger { color: #a4453a; border-color: #e7cfca; background: #fdf6f5; flex: 0 0 auto; width: 72px; }

  footer.note {
    margin-top: 22px;
    font-size: 12px;
    color: var(--ink-soft);
    text-align: center;
  }
</style>
</head>
<body>

<div class="app">
  <header class="top">
    <div>
      <h1>我的行程</h1>
      <p>工作與生活的平衡表</p>
    </div>
  </header>

  <div class="layout">
    <aside class="sidebar">
      <div class="group">
        <h2>工作</h2>
        <div id="work-tags"></div>
      </div>
      <div class="group">
        <h2>生活</h2>
        <div id="life-tags"></div>
      </div>
      <button class="clear-btn" id="clear-day">清除選取狀態</button>
      <p class="hint" id="hint-text">月／週檢視：先點一個項目選取，再點日期快速上色；再點一次可取消。<br><br>不選項目時點日期，會進入當天的詳細檢視，可以打字備註、釘選重要事項。</p>
    </aside>

    <main class="calendar-card">
      <div class="cal-nav">
        <div class="nav-group">
          <button class="nav-btn" id="prev-btn">‹</button>
          <span class="month-label" id="month-label"></span>
          <button class="nav-btn" id="next-btn">›</button>
        </div>
        <div class="nav-right">
          <div class="view-switch" id="view-switch">
            <button data-view="month">月</button>
            <button data-view="week">週</button>
            <button data-view="day">日</button>
          </div>
          <button class="today-btn" id="today-btn">今天</button>
        </div>
      </div>

      <div id="view-root"></div>
    </main>
  </div>

  <footer class="note">資料存在這台裝置的瀏覽器裡（localStorage），目前是單機版架構，之後可以再加上雲端同步。</footer>
</div>

<div class="sheet-overlay" id="sheet-overlay">
  <div class="sheet">
    <h3 id="sheet-title">新增項目</h3>
    <div class="sheet-tags" id="sheet-tags"></div>
    <textarea id="sheet-note" placeholder="備註（例如想看的 Netflix／Disney+ 影片、運動內容、備課重點…）"></textarea>
    <label class="pin-row"><input type="checkbox" id="sheet-pin"> 設為今日焦點（釘選在最上面）</label>
    <div class="sheet-actions">
      <button class="sheet-btn danger" id="sheet-delete" style="display:none">刪除</button>
      <button class="sheet-btn" id="sheet-cancel">取消</button>
      <button class="sheet-btn primary" id="sheet-save">儲存</button>
    </div>
  </div>
</div>

<script>
  const TAGS = {
    work: [
      { id: "w1", label: "國小備課", color: "var(--work-1)" },
      { id: "w2", label: "國中備課", color: "var(--work-2)" },
      { id: "w3", label: "高中備課", color: "var(--work-3)" },
      { id: "w4", label: "作文",    color: "var(--work-4)" },
      { id: "w5", label: "文本閱讀", color: "var(--work-5)" },
      { id: "w6", label: "考卷製作", color: "var(--work-6)" },
    ],
    life: [
      { id: "l1", label: "上課安排",         color: "var(--life-1)" },
      { id: "l2", label: "運動",            color: "var(--life-2)" },
      { id: "l3", label: "交流進修",         color: "var(--life-3)" },
      { id: "l4", label: "休閒（Disney+/Netflix）", color: "var(--life-4)" },
      { id: "l5", label: "雜事處理",         color: "var(--life-5)" },
      { id: "l6", label: "特別事項",         color: "var(--life-6)" },
      { id: "l7", label: "整理家務",         color: "var(--life-7)" },
    ],
  };

  const ALL_TAGS = [...TAGS.work, ...TAGS.life];
  const STORAGE_KEY = "candice_schedule_v2";
  const WEEKDAY_LABELS = ["日", "一", "二", "三", "四", "五", "六"];

  let activeTagId = null;      // quick-paint tag selected in sidebar (month/week view)
  let view = "month";          // 'month' | 'week' | 'day'
  let refDate = new Date();    // the date currently focused / displayed
  refDate.setHours(0,0,0,0);

  let sheetState = null;       // { dateKey, entryId|null, tagId }

  // ---------- data ----------
  function loadData() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    catch (e) { return {}; }
  }
  function saveData(data) {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
  }
  function dateKey(dt) {
    return `${dt.getFullYear()}-${String(dt.getMonth()+1).padStart(2,"0")}-${String(dt.getDate()).padStart(2,"0")}`;
  }
  function makeId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2,7);
  }
  function tagById(id) { return ALL_TAGS.find(t => t.id === id); }
  function sameDate(a,b) {
    return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate();
  }
  function addDays(dt, n) {
    const d = new Date(dt);
    d.setDate(d.getDate()+n);
    return d;
  }
  function startOfWeek(dt) {
    const d = new Date(dt);
    d.setDate(d.getDate() - d.getDay());
    return d;
  }

  // ---------- sidebar ----------
  function renderTagButtons() {
    const workEl = document.getElementById("work-tags");
    const lifeEl = document.getElementById("life-tags");
    workEl.innerHTML = "";
    lifeEl.innerHTML = "";

    function makeBtn(tag) {
      const btn = document.createElement("button");
      btn.className = "tag-btn" + (activeTagId === tag.id ? " active" : "");
      btn.innerHTML = `<span class="dot" style="background:${tag.color}"></span>${tag.label}`;
      btn.onclick = () => {
        activeTagId = activeTagId === tag.id ? null : tag.id;
        renderTagButtons();
      };
      return btn;
    }
    TAGS.work.forEach(t => workEl.appendChild(makeBtn(t)));
    TAGS.life.forEach(t => lifeEl.appendChild(makeBtn(t)));
  }

  // ---------- quick paint (month/week tap with active tag, no note) ----------
  function quickToggle(key) {
    if (!activeTagId) return false;
    const data = loadData();
    const list = data[key] || [];
    const idx = list.findIndex(e => e.tagId === activeTagId && !e.note);
    if (idx >= 0) list.splice(idx, 1);
    else list.push({ id: makeId(), tagId: activeTagId, note: "", pinned: false });
    data[key] = list;
    saveData(data);
    return true;
  }

  // ---------- view switch + nav ----------
  function setView(v) {
    view = v;
    document.querySelectorAll("#view-switch button").forEach(b => {
      b.classList.toggle("active", b.dataset.view === v);
    });
    render();
  }

  function navPrev() {
    if (view === "month") refDate = new Date(refDate.getFullYear(), refDate.getMonth()-1, 1);
    else if (view === "week") refDate = addDays(refDate, -7);
    else refDate = addDays(refDate, -1);
    render();
  }
  function navNext() {
    if (view === "month") refDate = new Date(refDate.getFullYear(), refDate.getMonth()+1, 1);
    else if (view === "week") refDate = addDays(refDate, 7);
    else refDate = addDays(refDate, 1);
    render();
  }

  function goToDay(dt) {
    refDate = new Date(dt);
    refDate.setHours(0,0,0,0);
    setView("day");
  }

  // ---------- render dispatch ----------
  function render() {
    const root = document.getElementById("view-root");
    root.innerHTML = "";
    if (view === "month") { document.getElementById("hint-text").innerHTML = "月／週檢視：先點一個項目選取，再點日期快速上色；再點一次可取消。<br><br>不選項目時點日期，會進入當天的詳細檢視，可以打字備註、釘選重要事項。"; renderMonth(root); }
    else if (view === "week") { document.getElementById("hint-text").innerHTML = "月／週檢視：先點一個項目選取，再點日期快速上色；再點一次可取消。<br><br>不選項目時點日期，會進入當天的詳細檢視，可以打字備註、釘選重要事項。"; renderWeek(root); }
    else { document.getElementById("hint-text").innerHTML = "點「＋ 新增項目」可以選類別、打字備註；點☆可以把重要事項釘選到最上面「今日焦點」。"; renderDay(root); }
  }

  function chipListHTML(entries, max) {
    const shown = entries.slice(0, max);
    let html = '<div class="chip-list">';
    shown.forEach(e => {
      const tag = tagById(e.tagId);
      if (!tag) return;
      const text = e.note ? e.note : tag.label;
      html += `<span class="tag-chip" style="background:${tag.color}">${(e.pinned?"★ ":"")}${escapeHTML(text)}</span>`;
    });
    html += "</div>";
    if (entries.length > max) {
      html += `<span class="chip-more">+${entries.length - max} 更多</span>`;
    }
    return html;
  }

  function escapeHTML(s) {
    return s.replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  // ---------- MONTH ----------
  function renderMonth(root) {
    const y = refDate.getFullYear(), m = refDate.getMonth();
    document.getElementById("month-label").textContent = `${y} 年 ${m+1} 月`;

    const wrap = document.createElement("div");
    const weekRow = document.createElement("div");
    weekRow.className = "grid-week";
    WEEKDAY_LABELS.forEach(w => { const s = document.createElement("span"); s.textContent = w; weekRow.appendChild(s); });
    wrap.appendChild(weekRow);

    const grid = document.createElement("div");
    grid.className = "grid-days";

    const firstWeekday = new Date(y, m, 1).getDay();
    const daysInMonth = new Date(y, m+1, 0).getDate();
    const data = loadData();
    const today = new Date();

    for (let i = 0; i < firstWeekday; i++) {
      const empty = document.createElement("div");
      empty.className = "day empty";
      grid.appendChild(empty);
    }

    for (let d = 1; d <= daysInMonth; d++) {
      const dt = new Date(y, m, d);
      const key = dateKey(dt);
      const entries = data[key] || [];
      const cell = document.createElement("div");
      cell.className = "day" + (sameDate(dt, today) ? " is-today" : "");
      cell.innerHTML = `<div class="num">${d}</div>` + chipListHTML(entries, 3);

      cell.onclick = () => {
        if (activeTagId) { quickToggle(key); render(); }
        else goToDay(dt);
      };
      grid.appendChild(cell);
    }
    wrap.appendChild(grid);
    root.appendChild(wrap);
  }

  // ---------- WEEK ----------
  function renderWeek(root) {
    const start = startOfWeek(refDate);
    const end = addDays(start, 6);
    const sameMonth = start.getMonth() === end.getMonth();
    document.getElementById("month-label").textContent = sameMonth
      ? `${start.getFullYear()} 年 ${start.getMonth()+1} 月 ${start.getDate()}–${end.getDate()} 日`
      : `${start.getMonth()+1}/${start.getDate()} – ${end.getMonth()+1}/${end.getDate()}`;

    const grid = document.createElement("div");
    grid.className = "week-grid";
    const data = loadData();
    const today = new Date();

    for (let i = 0; i < 7; i++) {
      const dt = addDays(start, i);
      const key = dateKey(dt);
      const entries = data[key] || [];
      const col = document.createElement("div");
      col.className = "week-col" + (sameDate(dt, today) ? " is-today" : "");

      const head = document.createElement("div");
      head.className = "week-col-head";
      head.innerHTML = `<span class="wd">${WEEKDAY_LABELS[dt.getDay()]}</span><span class="dn">${dt.getDate()}</span>`;
      head.onclick = () => goToDay(dt);
      col.appendChild(head);

      const body = document.createElement("div");
      body.innerHTML = chipListHTML(entries, 6);
      col.appendChild(body);

      col.onclick = (e) => {
        if (e.target.closest(".week-col-head")) return;
        if (activeTagId) { quickToggle(key); render(); }
        else goToDay(dt);
      };

      grid.appendChild(col);
    }
    root.appendChild(grid);
  }

  // ---------- DAY ----------
  function renderDay(root) {
    const key = dateKey(refDate);
    document.getElementById("month-label").textContent = `${refDate.getMonth()+1} 月 ${refDate.getDate()} 日`;

    const data = loadData();
    const entries = data[key] || [];
    const pinned = entries.filter(e => e.pinned);
    const rest = entries.filter(e => !e.pinned);

    const head = document.createElement("div");
    head.className = "day-view-head";
    head.innerHTML = `<div class="big-date">${refDate.getFullYear()} 年 ${refDate.getMonth()+1} 月 ${refDate.getDate()} 日　星期${WEEKDAY_LABELS[refDate.getDay()]}</div>`;
    root.appendChild(head);

    if (pinned.length) {
      const pinSection = document.createElement("div");
      pinSection.className = "pin-section";
      pinSection.innerHTML = `<h3>★ 今日焦點</h3>`;
      pinned.forEach(e => pinSection.appendChild(entryRow(key, e)));
      root.appendChild(pinSection);
    }

    const listCard = document.createElement("div");
    if (rest.length === 0 && pinned.length === 0) {
      listCard.innerHTML = `<div class="empty-note">這天還沒有安排，點下面「＋ 新增項目」開始。</div>`;
    } else if (rest.length === 0) {
      listCard.innerHTML = `<div class="empty-note">其餘項目都已釘選在上面了。</div>`;
    } else {
      rest.forEach(e => listCard.appendChild(entryRow(key, e)));
    }
    root.appendChild(listCard);

    const addBtn = document.createElement("button");
    addBtn.className = "add-entry-btn";
    addBtn.textContent = "＋ 新增項目";
    addBtn.onclick = () => openSheet(key, null);
    root.appendChild(addBtn);
  }

  function entryRow(key, entry) {
    const tag = tagById(entry.tagId);
    const row = document.createElement("div");
    row.className = "entry-row";
    row.innerHTML = `
      <span class="edot" style="background:${tag ? tag.color : "#ccc"}"></span>
      <div class="etext">
        <div class="elabel">${tag ? tag.label : "未分類"}</div>
        ${entry.note ? `<div class="enote">${escapeHTML(entry.note)}</div>` : ""}
      </div>
      <button class="pin-toggle ${entry.pinned ? "pinned" : ""}" title="釘選">${entry.pinned ? "★" : "☆"}</button>
    `;
    row.querySelector(".etext").onclick = () => openSheet(key, entry.id);
    row.querySelector(".pin-toggle").onclick = (ev) => {
      ev.stopPropagation();
      togglePin(key, entry.id);
    };
    return row;
  }

  function togglePin(key, entryId) {
    const data = loadData();
    const list = data[key] || [];
    const e = list.find(x => x.id === entryId);
    if (e) e.pinned = !e.pinned;
    data[key] = list;
    saveData(data);
    render();
  }

  // ---------- entry sheet (add/edit) ----------
  function openSheet(key, entryId) {
    const data = loadData();
    const list = data[key] || [];
    const existing = entryId ? list.find(e => e.id === entryId) : null;

    sheetState = { key, entryId, tagId: existing ? existing.tagId : null };

    document.getElementById("sheet-title").textContent = existing ? "編輯項目" : "新增項目";
    document.getElementById("sheet-note").value = existing ? existing.note : "";
    document.getElementById("sheet-pin").checked = existing ? !!existing.pinned : false;
    document.getElementById("sheet-delete").style.display = existing ? "block" : "none";

    renderSheetTags();
    document.getElementById("sheet-overlay").classList.add("open");
  }

  function closeSheet() {
    document.getElementById("sheet-overlay").classList.remove("open");
    sheetState = null;
  }

  function renderSheetTags() {
    const wrap = document.getElementById("sheet-tags");
    wrap.innerHTML = "";
    ALL_TAGS.forEach(tag => {
      const btn = document.createElement("button");
      btn.className = "sheet-tag-btn" + (sheetState.tagId === tag.id ? " selected" : "");
      btn.innerHTML = `<span class="dot" style="background:${tag.color}"></span>${tag.label}`;
      btn.onclick = () => { sheetState.tagId = tag.id; renderSheetTags(); };
      wrap.appendChild(btn);
    });
  }

  document.getElementById("sheet-cancel").onclick = closeSheet;
  document.getElementById("sheet-overlay").onclick = (e) => { if (e.target.id === "sheet-overlay") closeSheet(); };

  document.getElementById("sheet-save").onclick = () => {
    if (!sheetState) return;
    if (!sheetState.tagId) { alert("請先選一個類別"); return; }
    const data = loadData();
    const list = data[sheetState.key] || [];
    const note = document.getElementById("sheet-note").value.trim();
    const pinned = document.getElementById("sheet-pin").checked;

    if (sheetState.entryId) {
      const e = list.find(x => x.id === sheetState.entryId);
      if (e) { e.tagId = sheetState.tagId; e.note = note; e.pinned = pinned; }
    } else {
      list.push({ id: makeId(), tagId: sheetState.tagId, note, pinned });
    }
    data[sheetState.key] = list;
    saveData(data);
    closeSheet();
    render();
  };

  document.getElementById("sheet-delete").onclick = () => {
    if (!sheetState || !sheetState.entryId) return;
    const data = loadData();
    let list = data[sheetState.key] || [];
    list = list.filter(x => x.id !== sheetState.entryId);
    data[sheetState.key] = list;
    saveData(data);
    closeSheet();
    render();
  };

  // ---------- nav wiring ----------
  document.getElementById("prev-btn").onclick = navPrev;
  document.getElementById("next-btn").onclick = navNext;
  document.getElementById("today-btn").onclick = () => { refDate = new Date(); refDate.setHours(0,0,0,0); render(); };
  document.getElementById("clear-day").onclick = () => { activeTagId = null; renderTagButtons(); };
  document.querySelectorAll("#view-switch button").forEach(b => b.onclick = () => setView(b.dataset.view));

  renderTagButtons();
  setView("month");
</script>

</body>
</html>
